id: Logd_Disabler_ColorOS16

name: ColorOS16 优化版
summary: ColorOS 16（一加 / OPPO）系统精简与隐私优化。图形界面逐项关闭日志、遥测、云控域名与冗余服务，所有改动可一键还原。
description: README.md
license: CC-BY-NC-ND-4.0
