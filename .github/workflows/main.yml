name: Build Module and Release

# 触发条件：推送 v* 格式的 tag（如 v1.1），或手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 需要写权限：上传 Release 资产 + 推送 update.json 回 main 分支
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 从 module.prop 提取版本信息，供 update.json 使用
      - name: Read module.prop version info
        id: module_info
        run: |
          echo "version=$(grep '^version=' module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(grep '^versionCode=' module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.ref_name }}"

      # 打包可刷 zip：改用【排除法】，与本地 zip.sh 完全一致
      # 【本次修复】旧版用白名单，导致 sepolicy.rule 与 uninstall.sh 被漏打包：
      #   - 缺 sepolicy.rule → pm 全部报 "Can't find service: package"
      #   - 缺 uninstall.sh  → 卸载后不回滚，包/属性/挂载永久残留
      #   实测 Release v2.3.0 zip(15 条目) 确认两文件缺失。
      #   排除法可自动包含后续新增文件（如 cnss_diag_*.conf），不会再漏。
      - name: Package module zip
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          zip -9 -r Logd_Disabler_ColorOS16.zip . \
            -x "*.git*" "*.github*" "*.lingma*" ".gitignore" "README.md" \
            "Logd_Disabler_ColorOS16.zip" "zip.sh" "update.json" "reference/*"
          echo "--- zip contents ---"
          unzip -l Logd_Disabler_ColorOS16.zip

      # 【本次新增】打包自检：必需文件缺失直接失败，防止再次漏打包
      - name: Verify zip contains required files
        run: |
          FAIL=0
          for f in module.prop customize.sh service.sh post-fs-data.sh \
                   boot-completed.sh uninstall.sh sepolicy.rule \
                   cnss_diag_off.conf cnss_diag_always_on_off.conf \
                   webroot/index.html; do
            if unzip -l Logd_Disabler_ColorOS16.zip | grep -qE "[[:space:]](\./)?${f}\$"; then
              echo "✅ $f"
            else
              echo "::error::zip 缺少必需文件: $f"
              FAIL=1
            fi
          done
          if unzip -l Logd_Disabler_ColorOS16.zip | grep -qE "[[:space:]](\./)?verify_status.sh\$"; then
            echo "::error::verify_status.sh 应已删除，不应出现在 zip 中"
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ] || exit 1
          echo "✅ 打包自检通过"

      # 生成 update.json 到临时位置（不污染当前工作区）
      - name: Generate update.json
        run: |
          cat > /tmp/update.json <<EOF
          {
            "version": "${{ steps.module_info.outputs.version }}",
            "versionCode": ${{ steps.module_info.outputs.version_code }},
            "zipUrl": "https://github.com/starlifezzz/Logd_Disabler_ColorOS16/releases/download/${{ github.ref_name }}/Logd_Disabler_ColorOS16.zip",
            "changelog": "https://github.com/starlifezzz/Logd_Disabler_ColorOS16/releases/tag/${{ github.ref_name }}"
          }
          EOF
          cat /tmp/update.json

      # 把 update.json 推回 main 分支（module.prop 的 updateJson 指向 main 分支文件）
      - name: Commit update.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp /tmp/update.json update.json
          git add update.json
          git diff --cached --quiet || git commit -m "chore: update update.json for ${{ github.ref_name }}"
          git push origin main

      # 上传 zip 到 GitHub Release（tag 对应版本）
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Logd_Disabler_ColorOS16.zip
          generate_release_notes: true
 