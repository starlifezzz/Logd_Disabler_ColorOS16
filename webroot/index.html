    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>ColorOS 16 优化</title>

        <!-- Web Components Polyfill (必须放在最顶部) -->
        <script src="assets/webcomponents-bundle.min.js"></script>

        <!-- MDUI v2 核心文件 -->
        <!-- <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
        <script src="https://unpkg.com/mdui@2/mdui.global.js"></script> -->

        <link rel="stylesheet" href="assets/mdui.css">
        <script src="assets/mdui.global.js"></script>  




        <script>
            // 确保 Web Components 已就绪
            if (!window.customElements) {
                document.write('<script src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs@2.7.0/webcomponents-bundle.min.js"><\/script>');
            }

            // MDUI 初始化修复
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof mdui === 'undefined') {
                // 如果 MDUI 未初始化，强制重试
                setTimeout(() => {
                    if (typeof mdui === 'undefined') {
                    console.error('MDUI 初始化失败，尝试手动注册组件');
                    // 手动注册关键组件（针对 ColorOS 16 WebView）
                    if (!customElements.get('mdui-card')) {
                        customElements.define('mdui-card', class extends HTMLElement {
                        connectedCallback() {
                            this.style.borderRadius = '24px';
                            this.style.backgroundColor = 'var(--md-surface-variant)';
                            this.style.padding = '16px';
                            this.style.marginBottom = '16px';
                            this.style.boxShadow = '0 1px 3px rgba(0,0,0,0.05)';
                        }
                        });
                    }
                    // 其他组件类似...
                    }
                }, 1000);
                }
            });
        </script>

        <!-- Material Symbols 图标字体（可选，无网可删掉这行） -->
        <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"> -->

        <!-- Vue 3 -->
        <script src="assets/vue.global.prod.js"></script>


    </head>
    <body class="mdui-prose">

    <div id="app">
        <mdui-layout>
            <!-- 顶部导航栏 -->
            <mdui-top-app-bar variant="small" scroll-behavior="elevate">
                <mdui   -top-app-bar-title>ColorOS 16 优化</mdui-top-app-bar-title>
                <mdui-icon-button slot="end" icon="refresh" @click="fetchStatus"></mdui-icon-button>
                <!-- 悬浮刷新按钮 -->
                <mdui-fab class="fab-refresh" variant="primary" icon="refresh" @click="fetchStatus" id="sx" style="margin:-10px 1px 0px 0"></mdui-fab>
            </mdui-top-app-bar>

            <mdui-layout-main>

                <!-- 卡片1：守护进程控制 -->
                <div class="card-section">
                    <mdui-card variant="outlined" style="width:100%; overflow:hidden;">
                        <mdui-list-header>守护进程</mdui-list-header>
                        <mdui-list>
                            <mdui-list-item
                                v-for="(item, key) in processFeatures" :key="key"
                                :headline="item.name"
                                :description="item.desc"
                                rounded
                            >
                                <mdui-icon slot="icon" :name="item.icon" style="font-size:24px;"></mdui-icon>
                                <div slot="description">
                                    <span>{{ item.desc }}</span>
                                    <div class="item-meta">
                                        <span class="status-badge" :class="status[key]?.st || 'pending'">
                                            {{ getStatusText(status[key]?.st) }}
                                        </span>
                                    </div>
                                </div>
                                <mdui-switch
                                    slot="end"
                                    :checked="config[key]"
                                    @change="onSwitchChange(key, $event)"
                                ></mdui-switch>
                            </mdui-list-item>
                        </mdui-list>
                    </mdui-card>
                </div>

                <!-- 卡片2：系统调优 -->
                <div class="card-section">
                    <mdui-card variant="outlined" style="width:100%; overflow:hidden;">
                        <mdui-list-header>系统调优</mdui-list-header>
                        <mdui-list>
                            <mdui-list-item
                                v-for="(item, key) in tuningFeatures" :key="key"
                                :headline="item.name"
                                :description="item.desc"
                                rounded
                            >
                                <mdui-icon slot="icon" :name="item.icon" style="font-size:24px;"></mdui-icon>
                                <div slot="description">
                                    <span>{{ item.desc }}</span>
                                    <div class="item-meta">
                                        <span class="status-badge" :class="status[key]?.st || 'pending'">
                                            {{ getStatusText(status[key]?.st) }}
                                        </span>
                                    </div>
                                </div>
                                <mdui-switch
                                    slot="end"
                                    :checked="config[key]"
                                    @change="onSwitchChange(key, $event)"
                                ></mdui-switch>
                            </mdui-list-item>
                        </mdui-list>
                    </mdui-card>
                </div>

                <!-- 卡片3：关于 -->
                <div class="card-section">
                    <mdui-card variant="outlined" style="width:100%; padding:16px;">
                        <mdui-list-item
                            headline="安全模式"
                            description="开机按住【音量下键】可跳过所有优化，防止 Bootloop"
                        >
                            <mdui-icon slot="icon" name="shield" style="font-size:24px;"></mdui-icon>
                        </mdui-list-item>
                    </mdui-card>
                </div>

            </mdui-layout-main>


            <!-- 底部导航栏 -->
            <mdui-navigation-bar value="home">
                <mdui-navigation-bar-item icon="home" value="home">
                    首页
                </mdui-navigation-bar-item>
                <mdui-navigation-bar-item icon="tune" value="tuning">
                    调优
                </mdui-navigation-bar-item>
                <mdui-navigation-bar-item icon="info" value="about">
                    关于
                </mdui-navigation-bar-item>
            </mdui-navigation-bar>

        </mdui-layout>
        </mdui-layout>

        <!-- 全局加载遮罩 -->
        <mdui-dialog
            :open="isLoading"
            headline="正在检测系统状态..."
            close-on-overlay-click="false"
        >
            <div style="display:flex; justify-content:center; padding:24px;">
                <mdui-circular-progress></mdui-circular-progress>
            </div>
        </mdui-dialog>
    </div>

    <script>
        const { createApp, reactive, ref, onMounted } = Vue;

        // 定义功能配置（分为两组卡片）
        const PROCESS_FEATURES = {
            disable_logd: {
                name: "彻底禁用 Logd",
                desc: "mount 覆盖 + 强杀进程，永久封死复活",
                icon: "bug_report"
            },
            block_ota: {
                name: "阻断 OTA 更新",
                desc: "覆盖 update_engine + 清除 OTA 缓存",
                icon: "system_update"
            },
            kill_redundant_processes: {
                name: "查杀冗余进程",
                desc: "smartscene / sysmonitor / hotstart 等",
                icon: "memory"
            },
            block_ads_and_tracking: {
                name: "关闭广告与数据收集",
                desc: "关闭个性化广告、用户体验计划、数据统计",
                icon: "visibility_off"
            }
        };

        const TUNING_FEATURES = {
            lock_developer_options: {
                name: "锁定开发者选项",
                desc: "防止系统重置开发者选项与 ADB 状态",
                icon: "developer_mode"
            },
            memory_io_optimization: {
                name: "内存 / IO 优化",
                desc: "关闭 schedstats / binder debug / 限制内存压缩",
                icon: "speed"
            },
            extra_kernel_optimization: {
                name: "额外内核优化",
                desc: "降低 printk 日志级别 + 禁用透明大页",
                icon: "settings_suggest"
            }
        };

        const app = createApp({
            setup() {
                const isLoading = ref(false);

                const config = reactive({
                    disable_logd: false,
                    block_ota: false,
                    lock_developer_options: false,
                    kill_redundant_processes: false,
                    block_ads_and_tracking: false,
                    memory_io_optimization: false,
                    extra_kernel_optimization: false
                });

                const status = reactive({});

                // ========== Shell 执行封装（兼容所有管理器） ==========
                const execShell = async (cmd) => {
                    return new Promise((resolve) => {
                        if (typeof ksu !== 'undefined' && ksu.exec) {
                            const res = ksu.exec(cmd);
                            if (res && typeof res.then === 'function') {
                                res.then(stdout => resolve({ code: 0, stdout: stdout.trim() }))
                                .catch(err => resolve({ code: 1, stdout: "", stderr: String(err) }));
                            } else if (typeof ksu.exec === 'function' && ksu.exec.length >= 2) {
                                ksu.exec(cmd, "", (code, stdout, stderr) => resolve({ code, stdout: (stdout||"").trim(), stderr }));
                            } else {
                                resolve({ code: 0, stdout: String(res).trim(), stderr: "" });
                            }
                        } else {
                            // 浏览器 Mock（本地调试用）
                            resolve({
                                code: 0,
                                stdout: JSON.stringify({
                                    disable_logd: {cfg:true, st:"success"},
                                    block_ota: {cfg:false, st:"success"},
                                    lock_developer_options: {cfg:true, st:"success"},
                                    kill_redundant_processes: {cfg:true, st:"success"},
                                    block_ads_and_tracking: {cfg:true, st:"success"},
                                    memory_io_optimization: {cfg:false, st:"success"},
                                    extra_kernel_optimization: {cfg:true, st:"success"}
                                }),
                                stderr: ""
                            });
                        }
                    });
                };

                // ========== 获取状态 ==========
                const fetchStatus = async () => {
                    isLoading.value = true;
                    try {
                        const res = await execShell("sh /data/adb/modules/coloros16_optimize/get_status_json.sh");
                        if (res.code === 0 && res.stdout) {
                            const jsonMatch = res.stdout.match(/\{[\s\S]*\}/);
                            if (jsonMatch) {
                                const data = JSON.parse(jsonMatch[0]);
                                Object.assign(status, data);
                                // 同步 UI 开关
                                for (let key in config) {
                                    if (data[key]) config[key] = data[key].cfg;
                                }
                            }
                        }
                    } catch (e) {
                        console.error("状态解析失败:", e);
                        showToast("⚠️ 状态获取异常，请检查脚本权限");
                    } finally {
                        isLoading.value = false;
                    }
                };

                // ========== 保存配置 ==========
                const onSwitchChange = async (key, event) => {
                    const newVal = event.target.checked;
                    config[key] = newVal; // 先乐观更新 UI
                    const propVal = newVal ? "true" : "false";
                    await execShell(`setprop persist.sys.coloros16_optimize_gui.${key} ${propVal}`);
                    showToast(newVal ? "✅ 已开启，重启后生效" : "⭕ 已关闭，重启后生效");
                    // 延迟刷新状态
                    setTimeout(fetchStatus, 600);
                };

                // ========== Toast 提示（优先 MDUI snackbar，回退 ksu.toast） ==========
                const showToast = (msg) => {
                    if (typeof mdui !== 'undefined' && mdui.snackbar) {
                        mdui.snackbar({
                            message: msg,
                            position: 'bottom',
                            autoCloseDelay: 2000
                        });
                    } else if (typeof ksu !== 'undefined' && ksu.toast) {
                        ksu.toast(msg);
                    }
                };

                // ========== 状态文本映射 ==========
                const getStatusText = (st) => {
                    switch(st) {
                        case 'success': return '✅ 已生效';
                        case 'pending': return '⏳ 等待重启';
                        default: return '⏳ 检测中';
                    }
                };

                onMounted(fetchStatus);

                return {
                    isLoading, config, status,
                    processFeatures: PROCESS_FEATURES,
                    tuningFeatures: TUNING_FEATURES,
                    fetchStatus, onSwitchChange, getStatusText
                };
            }
        });

        // 关键：告诉 Vue 3 不要拦截 mdui-* 自定义元素标签
        app.config.compilerOptions.isCustomElement = (tag) => tag.startsWith('mdui-');
        app.mount('#app');
    </script>
    </body>

    </html>
