<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ColorOS 16 优化</title>
<!-- ========== 本地资源（全部走模块内本地文件，不引用 CDN / 在线组件库）==========
     引入顺序有讲究：
     1. webcomponents polyfill 必须先于 mdui（mdui2 依赖 Web Components）
     2. mdui.css 提供 Material 3 主题
     3. outlined.css 提供 Material Icons Outlined 字体（@font-face 指向本地 woff2）
     4. mdui.global.js 提供 window.mdui 组件
     5. vue.global.prod.js 提供 window.Vue（全局构建版，可直接 script 引入）
-->
<script src="./assets/webcomponents-bundle.min.js"></script>
<link rel="stylesheet" href="./assets/mdui.css">
<link rel="stylesheet" href="./assets/outlined.css">
<script src="./assets/mdui.global.js"></script>
<script src="./assets/vue.global.prod.js"></script>
<style>
/* 少量页面布局补充样式（组件主题色由 mdui.css 提供） */
body{background:var(--mdui-color-surface);color:var(--mdui-color-on-surface);margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.page{padding:16px 16px 96px;max-width:680px;margin:0 auto}
.banner{margin-bottom:16px;display:flex;align-items:flex-start;gap:8px;padding:12px 14px;border-radius:8px;background:rgba(var(--mdui-color-tertiary-container),.5);color:rgb(var(--mdui-color-on-tertiary-container));font-size:13px;line-height:1.5}
.card-gap{margin-bottom:16px;display:block;width:100%;box-sizing:border-box}
/* mdui-card 默认 inline-block，强制占满容器宽度（与功能卡片保持一致） */
mdui-card{width:100%}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:14px}
.info-row .k{color:var(--mdui-color-on-surface-variant)}
.info-row .v{font-weight:500}
.badge{display:inline-flex;align-items:center;font-size:12px;padding:2px 10px;border-radius:100px;font-weight:500}
.badge.on{background:rgba(var(--mdui-color-primary),.12);color:rgb(var(--mdui-color-primary))}
.badge.off{background:var(--mdui-color-surface-variant);color:var(--mdui-color-on-surface-variant)}
.badge.err{background:rgba(var(--mdui-color-error),.12);color:rgb(var(--mdui-color-error))}
.badge.work{background:rgba(var(--mdui-color-tertiary),.15);color:rgb(var(--mdui-color-tertiary))}
.log-box{width:100%;min-height:200px;max-height:55vh;overflow-y:auto;white-space:pre-wrap;word-break:break-all;font-family:monospace;font-size:12px;line-height:1.6;background:var(--mdui-color-surface-container);border-radius:8px;padding:12px;box-sizing:border-box}
.debug-item{margin-bottom:8px;padding:10px 12px;border-radius:8px;background:var(--mdui-color-surface-container);font-family:monospace;font-size:11px}
.debug-item .k{color:var(--mdui-color-primary);font-weight:500}
.debug-item .v{margin-top:4px;word-break:break-all}
.debug-item .raw{margin-top:6px;padding:6px 8px;border-radius:6px;background:rgba(128,128,128,.08);color:var(--mdui-color-on-surface-variant);font-size:10px;white-space:pre-wrap;word-break:break-all}
.dlg-body{max-height:70vh;overflow-y:auto}
.dlg-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;font-size:16px;font-weight:500}
.dlg-actions{display:flex;justify-content:flex-end;gap:4px;padding:12px 20px}
.footer{text-align:center;padding:20px 16px;font-size:12px;color:var(--mdui-color-on-surface-variant)}
.hidden{display:none!important}
mdui-list-item{--mdui-list-item-container-shape:12px}
/* ===== 聚合功能（mdui-collapse）样式 ===== */
.agg-collapse{width:100%;padding:4px 8px 8px;box-sizing:border-box}
.agg-collapse mdui-collapse-item{display:block;border-radius:12px;overflow:hidden;margin-bottom:4px}
.agg-collapse mdui-collapse-item:hover{background:rgba(var(--mdui-color-on-surface),.04)}
.agg-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px;width:100%;box-sizing:border-box;cursor:pointer}
.agg-title{flex:1;min-width:0}
.agg-title-main{font-size:15px;font-weight:500;color:var(--mdui-color-on-surface)}
.agg-title-sub{font-size:12px;color:var(--mdui-color-on-surface-variant);margin-top:2px}
.agg-control{display:flex;align-items:center;gap:8px;flex-shrink:0}
.agg-body{padding:4px 12px 12px;border-top:1px solid var(--mdui-color-surface-variant)}
.agg-hint{font-size:12px;color:var(--mdui-color-on-surface-variant);padding:8px 0}
.agg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 4px;font-size:13px;border-radius:8px}
.agg-row:nth-child(odd){background:rgba(var(--mdui-color-on-surface),.03)}
.agg-pkg{font-family:monospace;font-size:12px;color:var(--mdui-color-on-surface);word-break:break-all}
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- 顶栏 -->
  <mdui-top-app-bar scroll-behavior="shrink">
    <mdui-top-app-bar-title>ColorOS 16 优化</mdui-top-app-bar-title>
    <div slot="navigation-end" style="display:flex;align-items:center;gap:4px;margin-right:8px">
      <mdui-button-icon icon="refresh--outlined" @click="refreshAll"></mdui-button-icon>
    </div>
  </mdui-top-app-bar>

  <div class="page">
    <!-- 进度条 -->
    <mdui-linear-progress :value="progress" :hidden="!checking" style="margin-bottom:16px"></mdui-linear-progress>

    <!-- 提示横幅 -->
    <div class="banner">
      <span>开关 <b>主色=已禁用/已优化</b>，<b>灰色=未禁用/系统默认</b>。修改后需<b>重启设备</b>生效。</span>
    </div>

    <!-- 功能分组卡片 -->
    <template v-for="group in FEATURES" :key="group.group">
      <mdui-card class="card-gap" variant="elevated">
        <div style="padding:12px 20px 4px;font-size:14px;font-weight:600;color:var(--mdui-color-primary)">{{ group.group }}</div>

        <!-- 单项功能列表 -->
        <mdui-list v-if="groupSingle(group).length">
          <mdui-list-item
            v-for="item in groupSingle(group)"
            :key="'single-' + item.key + '-' + String(state[item.key].enabled)"
            @click="toggleItem(item)"
          >
            <div slot="headline">{{ item.title }}</div>
            <div slot="description">{{ item.desc }}</div>
            <span slot="end-icon" style="display:flex;align-items:center;gap:8px">
              <span class="badge" :class="badgeClass(item.key)">{{ badgeText(item.key) }}</span>
              <mdui-switch :checked="state[item.key].enabled" :disabled="state[item.key].loading" @click.stop @change="onSwitchChange(item, $event)"></mdui-switch>
            </span>
          </mdui-list-item>
        </mdui-list>

        <!-- 聚合功能（多个包）：mdui-collapse accordion 可折叠展开子包清单 -->
        <mdui-collapse accordion v-if="groupAgg(group).length" class="agg-collapse">
          <mdui-collapse-item
            v-for="item in groupAgg(group)"
            :key="'agg-' + item.key + '-' + String(state[item.key].enabled)"
            :disabled="state[item.key].loading"
          >
            <!-- header：标题 + 状态徽标 + 开关（点击开关不触发展开） -->
            <div slot="header" class="agg-header">
              <div class="agg-title">
                <div class="agg-title-main">{{ item.title }}</div>
                <div class="agg-title-sub">{{ item.desc }}</div>
              </div>
              <span class="agg-control">
                <span class="badge" :class="badgeClass(item.key)">{{ badgeText(item.key) }}</span>
                <mdui-switch :checked="state[item.key].enabled" :disabled="state[item.key].loading" @click.stop @change="onSwitchChange(item, $event)"></mdui-switch>
              </span>
            </div>
            <!-- body：子包清单 + 每个子包状态 -->
            <div class="agg-body" v-if="item.pkgs">
              <div class="agg-hint">一键禁用/恢复以下 {{ item.pkgs.length }} 个包（对应 service.sh 中同名属性分支）：</div>
              <div class="agg-row" v-for="p in item.pkgs" :key="p">
                <span class="agg-pkg">{{ p }}</span>
                <span class="badge" :class="pkgBadgeClass(item.key, p)">{{ pkgBadgeText(item.key, p) }}</span>
              </div>
            </div>
          </mdui-collapse-item>
        </mdui-collapse>
      </mdui-card>
    </template>

    <!-- 模块信息 -->
    <mdui-card class="card-gap" variant="elevated">
      <mdui-list>
        <div style="padding:12px 20px 4px;font-size:14px;font-weight:600;color:var(--mdui-color-primary)">模块信息</div>
        <div class="info-row"><span class="k">模块版本</span><span class="v">{{ moduleVersion }}</span></div>
        <mdui-divider></mdui-divider>
        <div class="info-row"><span class="k">KernelSU</span><span class="v">{{ ksuVersion }}</span></div>
        <mdui-divider></mdui-divider>
        <div class="info-row"><span class="k">SELinux</span><span class="v">{{ selinuxStatus }}</span></div>
        <mdui-divider></mdui-divider>
        <div class="info-row"><span class="k">设备</span><span class="v">OnePlus Ace5</span></div>
        <mdui-divider></mdui-divider>
        <div class="info-row"><span class="k">系统</span><span class="v">ColorOS 16</span></div>
      </mdui-list>
    </mdui-card>

    <div class="footer">Logd Disabler for ColorOS16<br>By ZhangChongjie</div>
  </div>

  <!-- 悬浮按钮：日志 -->
  <mdui-fab icon="receipt_long--outlined" label="日志" style="position:fixed;right:20px;bottom:24px;z-index:100" @click="logOpen=true"></mdui-fab>
  <!-- 悬浮按钮：Debug -->
  <mdui-fab icon="bug_report--outlined" label="Debug" style="position:fixed;left:20px;bottom:24px;z-index:100" @click="showDebug()"></mdui-fab>

  <!-- 日志对话框 -->
  <mdui-dialog :open="logOpen" @closed="logOpen=false" close-on-esc close-on-overlay-click style="width:min(92vw,480px)">
    <div slot="header" class="dlg-header">
      <span>操作日志</span>
      <mdui-button-icon icon="close--outlined" @click="logOpen=false"></mdui-button-icon>
    </div>
    <div class="dlg-body">
      <div class="log-box">{{ logText || '暂无日志' }}</div>
    </div>
    <div slot="action" class="dlg-actions">
      <mdui-button variant="text" @click="clearLog()">清空</mdui-button>
      <mdui-button variant="tonal" @click="logOpen=false">关闭</mdui-button>
    </div>
  </mdui-dialog>

  <!-- Debug 对话框 -->
  <mdui-dialog :open="debugOpen" @closed="debugOpen=false" close-on-esc close-on-overlay-click style="width:min(92vw,520px)">
    <div slot="header" class="dlg-header">
      <span>Debug 面板</span>
      <mdui-button-icon icon="close--outlined" @click="debugOpen=false"></mdui-button-icon>
    </div>
    <div class="dlg-body" v-html="debugHtml"></div>
    <div slot="action" class="dlg-actions">
      <mdui-button variant="text" @click="copyDebugInfo()">一键复制</mdui-button>
      <mdui-button variant="tonal" @click="debugOpen=false">关闭</mdui-button>
    </div>
  </mdui-dialog>
</div>

<script>
// ===================== 功能定义 =====================
var FEATURES = [
{ group: '守护进程', items: [
  { key: 'disable_logd', title: '禁用系统日志 (Logd)',
    desc: 'mount 覆盖 /system/bin/logd + 强杀进程',
    checkCmd: 'pgrep -x logd >/dev/null 2>&1 && echo running || echo stopped',
    verifyCmd: 'echo "进程:"; pgrep -x logd >/dev/null 2>&1 && echo running || echo stopped; echo "文件:"; if [ -f /system/bin/logd ]; then sz=$(stat -c %s /system/bin/logd 2>/dev/null); echo "size=$sz"; else echo "notfound"; fi'
  },
  { key: 'block_ota', title: '禁用 OTA 更新（5 个包）',
    desc: '覆盖 update_engine + 卸载 OTA 相关包',
    pkgs: ['com.oplus.ota', 'com.oplus.sau', 'com.oplus.cota', 'com.oplus.romupdate', 'com.oplus.upgradeguide'],
    checkCmd: 'pgrep -x update_engine >/dev/null 2>&1 && echo running || echo stopped',
    verifyCmd: 'echo "进程:"; pgrep -x update_engine >/dev/null 2>&1 && echo running || echo stopped; echo "包:"; for p in com.oplus.ota com.oplus.sau com.oplus.cota com.oplus.romupdate com.oplus.upgradeguide; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done; echo "属性:"; echo "ota_dl=$(getprop persist.ota.auto_download 2>/dev/null)"; echo "recovery=$(getprop persist.sys.recovery_update 2>/dev/null)"'
  },
  { key: 'lock_developer_options', title: '禁用开发者选项访问',
    desc: '防止系统重置开发者选项状态',
    checkCmd: 'test "$(settings get global development_settings_enabled 2>/dev/null)" = "0" && echo locked || echo unlocked',
    verifyCmd: 'echo "dev=$(settings get global development_settings_enabled 2>/dev/null)"; echo "lock=$(getprop persist.dev.option.lock 2>/dev/null)"'
  },
  { key: 'kill_redundant_processes', title: '禁用冗余后台进程',
    desc: 'smartscene / sysmonitor / hotstart / preload',
    checkCmd: 'r="ok"; pgrep -x smartscene >/dev/null 2>&1 && r="running"; pgrep -x sysmonitor >/dev/null 2>&1 && r="running"; pgrep -x hotstart >/dev/null 2>&1 && r="running"; echo "$r"',
    verifyCmd: 'echo "smartscene:"; pgrep -x smartscene 2>/dev/null || echo stopped; echo "preload:"; pgrep -x preload 2>/dev/null || echo stopped; echo "sysmonitor:"; pgrep -x sysmonitor 2>/dev/null || echo stopped; echo "hotstart:"; pgrep -x hotstart 2>/dev/null || echo stopped'
  },
  { key: 'system_prop_toggles', title: '禁用系统预加载属性',
    desc: '禁用 preload / monitor / hotstart 属性',
    checkCmd: 'test "$(getprop persist.sys.preload)" = "0" && echo set || echo unset',
    verifyCmd: 'echo "preload=$(getprop persist.sys.preload 2>/dev/null)"; echo "monitor=$(getprop persist.sys.monitor 2>/dev/null)"; echo "hotstart=$(getprop persist.sys.hotstart 2>/dev/null)"'
  }
]},
{ group: '隐私与广告', items: [
  { key: 'block_ads_and_tracking', title: '禁用广告与数据收集（3 个包）',
    desc: '关闭个性化广告、用户体验计划、数据统计',
    pkgs: ['com.oplus.statistics.rom', 'com.coloros.assistantscreen', 'com.coloros.sceneservice'],
    checkCmd: 'test "$(getprop persist.sys.oplus.ad_enable 2>/dev/null)" = "0" && echo disabled || echo enabled',
    verifyCmd: 'echo "包:"; for p in com.oplus.statistics.rom com.coloros.assistantscreen com.coloros.sceneservice; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done; echo "属性:"; echo "ad=$(getprop persist.sys.oplus.ad_enable 2>/dev/null)"; echo "pad=$(getprop persist.sys.oplus.personalized_ad 2>/dev/null)"; echo "track=$(getprop persist.ad.track 2>/dev/null)"; echo "usage=$(getprop persist.sys.usage_stat_enable 2>/dev/null)"; echo "collect=$(getprop persist.oppo.collect 2>/dev/null)"'
  }
]},
{ group: '性能优化', items: [
  { key: 'memory_io_optimization', title: '启用内存/IO 优化',
    desc: '关闭 schedstats / binder debug / compact',
    checkCmd: 'v=$(cat /proc/sys/kernel/sched_schedstats 2>/dev/null); test "$v" = "0" && echo ok || echo "fail($v)"',
    verifyCmd: 'echo "schedstats=$(cat /proc/sys/kernel/sched_schedstats 2>/dev/null)"; echo "binder=$(cat /sys/module/binder/parameters/debug_mask 2>/dev/null)"; echo "compact=$(cat /proc/sys/vm/compact_unevictable_allowed 2>/dev/null)"'
  },
  { key: 'extra_kernel_optimization', title: '启用内核深度优化',
    desc: 'printk 日志级别 / 禁用透明大页',
    checkCmd: 'p=$(cat /proc/sys/kernel/printk 2>/dev/null); echo "$p"',
    verifyCmd: 'echo "printk=$(cat /proc/sys/kernel/printk 2>/dev/null)"; echo "thp=$(cat /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null)"'
  }
]},
{ group: '可选禁用服务', items: [
  { key: 'disable_health_services', title: '禁用健康服务（1 个包）',
    desc: 'com.oplus.healthservice',
    pkgs: ['com.oplus.healthservice'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.healthservice" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.healthservice; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_network_monitoring', title: '禁用流量监控（2 个包）',
    desc: 'com.oplus.trafficmonitor / com.oplus.dmp',
    pkgs: ['com.oplus.trafficmonitor', 'com.oplus.dmp'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.trafficmonitor" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.trafficmonitor com.oplus.dmp; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_lockscreen_magazine', title: '禁用锁屏杂志（1 个包）',
    desc: 'com.heytap.pictorial',
    pkgs: ['com.heytap.pictorial'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.heytap.pictorial" && echo enabled || echo disabled',
    verifyCmd: 'echo "包:"; pm list packages -d --user 0 2>/dev/null | grep -qF "package:com.heytap.pictorial" && echo "com.heytap.pictorial:已禁用" || (pm list packages --user 0 2>/dev/null | grep -qF "package:com.heytap.pictorial" && echo "com.heytap.pictorial:运行中" || echo "com.heytap.pictorial:已卸载"); echo "属性:"; echo "mag=$(getprop persist.sys.lockscreen_magazine 2>/dev/null)"'
  },
  { key: 'disable_gamespace', title: '禁用游戏空间（1 个包）',
    desc: 'com.oplus.games',
    pkgs: ['com.oplus.games'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.games" && echo enabled || echo disabled',
    verifyCmd: 'pm list packages -d --user 0 2>/dev/null | grep -qF "package:com.oplus.games" && echo "com.oplus.games:已禁用" || (pm list packages --user 0 2>/dev/null | grep -qF "package:com.oplus.games" && echo "com.oplus.games:运行中" || echo "com.oplus.games:已卸载")'
  },
  { key: 'disable_wallet_services', title: '禁用钱包服务（2 个包）',
    desc: 'com.oplus.pay / com.coloros.securepay',
    pkgs: ['com.oplus.pay', 'com.coloros.securepay'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.pay" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.pay com.coloros.securepay; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_backup_services', title: '禁用备份与云服务（2 个包）',
    desc: 'com.oplus.wifibackuprestore / com.heytap.cloud',
    pkgs: ['com.oplus.wifibackuprestore', 'com.heytap.cloud'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.heytap.cloud" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.wifibackuprestore com.heytap.cloud; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_ai_assistants', title: '禁用 AI 智能助手（6 个包）',
    desc: 'aimemory / aiunit / aiwidgets / aiwriter / metis / obrain',
    pkgs: ['com.oplus.aimemory', 'com.oplus.aiunit', 'com.oplus.aiwidgets', 'com.oplus.aiwriter', 'com.oplus.metis', 'com.oplus.obrain'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.aimemory" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.aimemory com.oplus.aiunit com.oplus.aiwidgets com.oplus.aiwriter com.oplus.metis com.oplus.obrain; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_voice_assistants', title: '禁用语音助手（4 个包）',
    desc: 'ovoicemanager / speechassist / ttsaccessibilityengine',
    pkgs: ['com.oplus.ovoicemanager', 'com.oplus.ovoicemanager.wakeup', 'com.heytap.speechassist', 'com.oplus.ttsaccessibilityengine'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.ovoicemanager" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.ovoicemanager com.oplus.ovoicemanager.wakeup com.heytap.speechassist com.oplus.ttsaccessibilityengine; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_theme_services', title: '禁用主题和个性化服务（7 个包）',
    desc: 'themestore / keyguard.clock 等',
    pkgs: ['com.oplus.themestore', 'com.heytap.themestore', 'com.oplus.keyguard.clock.magazine', 'com.oplus.keyguard.clock.gallery', 'com.oplus.keyguard.clock.graffiti', 'com.oplus.keyguard.personality.clocks', 'com.oplus.keyguard.style.widgets'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.themestore" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.themestore com.heytap.themestore com.oplus.keyguard.clock.magazine com.oplus.keyguard.clock.gallery com.oplus.keyguard.clock.graffiti com.oplus.keyguard.personality.clocks com.oplus.keyguard.style.widgets; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_network_optimization', title: '禁用网络优化服务（5 个包）',
    desc: 'networksense / cellularqoe / tai.wifiqoe 等',
    pkgs: ['com.oplus.networksense', 'com.oplus.cellularqoe', 'com.oplus.tai.wifiqoe', 'com.oplus.tai.borderpresearch', 'com.oplus.nearcomm'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.networksense" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.networksense com.oplus.cellularqoe com.oplus.tai.wifiqoe com.oplus.tai.borderpresearch com.oplus.nearcomm; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_security_services', title: '禁用安全和权限服务（2 个包）',
    desc: 'com.oplus.securitykeyboard / com.coloros.securityguard',
    pkgs: ['com.oplus.securitykeyboard', 'com.coloros.securityguard'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.securitykeyboard" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.securitykeyboard com.coloros.securityguard; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_media_services', title: '禁用多媒体和娱乐服务（3 个包）',
    desc: 'com.oplus.screenrecorder / com.coloros.karaoke / com.oplus.mediacontroller',
    pkgs: ['com.oplus.screenrecorder', 'com.coloros.karaoke', 'com.oplus.mediacontroller'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.screenrecorder" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.screenrecorder com.coloros.karaoke com.oplus.mediacontroller; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  },
  { key: 'disable_system_tools', title: '禁用系统工具和监控服务（9 个包）',
    desc: 'powermonitor / logkit / crashbox 等',
    pkgs: ['com.oplus.powermonitor', 'com.oplus.audiomonitor', 'com.oplus.logkit', 'com.oplus.engineermode', 'com.oplus.crashbox', 'com.oplus.appplatform', 'com.oplus.contentportal', 'com.oplus.postmanservice', 'com.oplus.subsys'],
    checkCmd: 'pm list packages --user 0 2>/dev/null | grep -qF "com.oplus.powermonitor" && echo enabled || echo disabled',
    verifyCmd: 'for p in com.oplus.powermonitor com.oplus.audiomonitor com.oplus.logkit com.oplus.engineermode com.oplus.crashbox com.oplus.appplatform com.oplus.contentportal com.oplus.postmanservice com.oplus.subsys; do (pm list packages -d --user 0 2>/dev/null | grep -qF "package:$p" || ! pm list packages --user 0 2>/dev/null | grep -qF "package:$p") && echo "$p:已禁用" || echo "$p:运行中"; done'
  }
]}
];

// ===================== KernelSU 通信层 =====================
var PROP_PREFIX = 'persist.sys.coloros16_optimize_gui.';

function ksuExec(cmd) {
  return new Promise(function(resolve) {
    try {
      if (typeof ksu !== 'undefined' && ksu.exec) {
        var cb = '_cb' + Date.now() + Math.random().toString(36).slice(2);
        window[cb] = function(errno, stdout, stderr) {
          resolve({ errno: errno, stdout: stdout || '', stderr: stderr || '' });
          delete window[cb];
        };
        ksu.exec(cmd, '{}', cb);
      } else {
        console.log('[Mock]', cmd);
        resolve({ errno: 0, stdout: '', stderr: '' });
      }
    } catch(e) {
      resolve({ errno: -1, stdout: '', stderr: String(e) });
    }
  });
}

function sh(cmd) {
  var safe = cmd.replace(/'/g, "'\\''");
  return ksuExec("sh -c '" + safe + "'");
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ===================== Vue 应用 =====================
var app = Vue.createApp({
  data: function() {
    var st = {};
    var dbg = {};
    var pkgSt = {};
    FEATURES.forEach(function(g) {
      g.items.forEach(function(item) {
        st[item.key] = { enabled: false, loading: false, status: 'pending' };
        dbg[item.key] = { prop: '', checkRaw: '', verifyRaw: '' };
        if (item.pkgs) {
          pkgSt[item.key] = {};
          item.pkgs.forEach(function(p) { pkgSt[item.key][p] = 'unknown'; });
        }
      });
    });
    return {
      FEATURES: FEATURES,
      state: st,
      debugData: dbg,
      pkgStates: pkgSt,
      logLines: [],
      warnLogs: [],
      logOpen: false,
      debugOpen: false,
      debugHtml: '',
      serviceLogTail: '',
      checking: false,
      progress: 0,
      moduleVersion: 'v1.4',
      ksuVersion: 'KernelSU',
      selinuxStatus: '检测中...'
    };
  },
  computed: {
    logText: function() { return this.logLines.join('\n'); }
  },
  methods: {
    // ---------- 日志 ----------
    addLog: function(msg, level) {
      level = level || 'info';
      var t = new Date();
      var ts = ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+':'+('0'+t.getSeconds()).slice(-2);
      var line = '['+ts+'] ['+level.toUpperCase()+'] '+msg;
      this.logLines.push(line);
      if (level === 'warn' || level === 'error') this.warnLogs.push(line);
    },
    clearLog: function() {
      this.logLines = [];
      this.warnLogs = [];
    },
    // ---------- 分组辅助 ----------
    groupSingle: function(group) {
      return (group.items || []).filter(function(i) { return !i.pkgs; });
    },
    groupAgg: function(group) {
      return (group.items || []).filter(function(i) { return i.pkgs; });
    },
    // ---------- 子包状态徽标 ----------
    pkgBadgeClass: function(key, pkg) {
      var s = this.pkgStates[key] && this.pkgStates[key][pkg];
      if (s === 'disabled') return 'on';
      if (s === 'error') return 'err';
      return 'off';
    },
    pkgBadgeText: function(key, pkg) {
      var s = this.pkgStates[key] && this.pkgStates[key][pkg];
      if (s === 'disabled') return '已禁用';
      if (s === 'error') return '异常';
      if (s === 'enabled') return '运行中';
      return '未知';
    },
    // ---------- 解析 verifyCmd 输出中的每个包状态 ----------
    parsePkgStates: function(item, output) {
      var self = this;
      if (!item.pkgs || !output) return;
      // verifyCmd 输出形如 "com.oplus.xxx:已禁用" / "com.oplus.xxx:运行中"
      var lines = String(output).split('\n');
      item.pkgs.forEach(function(p) {
        var matched = false;
        lines.forEach(function(l) {
          var idx = l.indexOf(':');
          if (idx > 0 && l.indexOf(p) >= 0) {
            var tail = l.slice(idx + 1);
            if (tail.indexOf('已禁用') >= 0 || tail.indexOf('卸载') >= 0) {
              self.pkgStates[item.key][p] = 'disabled';
            } else if (tail.indexOf('运行中') >= 0 || tail.indexOf('存在') >= 0) {
              self.pkgStates[item.key][p] = 'enabled';
            }
            matched = true;
          }
        });
        if (!matched) self.pkgStates[item.key][p] = 'unknown';
      });
    },
    // ---------- 徽标 ----------
    badgeClass: function(key) {
      var s = this.state[key];
      if (s.loading) return 'work';
      if (s.status === 'enabled') return 'on';
      if (s.status === 'error') return 'err';
      return 'off';
    },
    badgeText: function(key) {
      var s = this.state[key];
      if (s.loading) return '⏳ 处理中';
      if (s.status === 'enabled') return '✅ 已禁用';
      if (s.status === 'error') return '❌ 异常';
      return '⭕ 未禁用';
    },
    // ---------- 读写属性 ----------
    readProp: function(key) {
      var self = this;
      return sh('getprop "' + PROP_PREFIX + key + '" 2>/dev/null').then(function(r) {
        var val = r.stdout.trim();
        self.debugData[key].prop = val || '(空)';
        return val === 'true' || val === '1';
      });
    },
    writeProp: function(key, enable) {
      var self = this;
      var val = enable ? 'true' : 'false';
      return sh('setprop "' + PROP_PREFIX + key + '" "' + val + '"').then(function(r) {
        self.addLog('设置属性 ' + PROP_PREFIX + key + '=' + val + ' (exit=' + r.errno + ')');
        if (r.errno !== 0) {
          self.addLog('setprop 失败: ' + r.stderr, 'error');
          return false;
        }
        return true;
      });
    },
    // ---------- 开关 ----------
    onSwitchChange: function(item, e) {
      var self = this;
      var wantOn = !!(e.target && e.target.checked);
      var s = this.state[item.key];
      if (s.loading) {
        // 恢复 switch 到真实状态
        e.target.checked = s.enabled;
        return;
      }
      s.loading = true;
      var action = wantOn ? '禁用' : '恢复';
      this.addLog('正在' + action + ' ' + item.title + '...');
      this.writeProp(item.key, wantOn).then(function(ok) {
        if (ok) {
          s.enabled = wantOn;
          s.status = wantOn ? 'enabled' : 'disabled';
          // 聚合项：切换后子包状态与开关一致（重启后 refreshAll 再精确核验）
          if (item.pkgs && self.pkgStates[item.key]) {
            item.pkgs.forEach(function(p) {
              self.pkgStates[item.key][p] = wantOn ? 'disabled' : 'enabled';
            });
          }
          self.addLog(item.title + ' ' + action + '成功，重启后完全生效');
        } else {
          s.status = 'error';
          self.addLog(item.title + ' ' + action + '失败', 'error');
        }
        s.loading = false;
      });
    },
    toggleItem: function(item) {
      // 点击整行也切换开关（跳过 loading 状态）
      var s = this.state[item.key];
      if (s.loading) return;
      // 直接驱动 state 切换，保持单一数据流
      this.onSwitchChange(item, { target: { checked: !s.enabled } });
    },
    // ---------- 状态检测 ----------
    checkItem: function(item) {
      var self = this;
      var s = this.state[item.key];
      return this.readProp(item.key).then(function(propEnabled) {
        return sh(item.checkCmd).then(function(checkR) {
          self.debugData[item.key].checkRaw = checkR.stdout.trim() || '(空)';
          return sh(item.verifyCmd).then(function(verifyR) {
            self.debugData[item.key].verifyRaw = verifyR.stdout.trim() || '(空)';
            self.parsePkgStates(item, verifyR.stdout);
            s.enabled = propEnabled;
            s.status = propEnabled ? 'enabled' : 'disabled';
          });
        });
      }).catch(function(e) {
        s.status = 'error';
        self.addLog('检测 ' + item.key + ' 失败: ' + e, 'error');
      });
    },
    refreshAll: function() {
      var self = this;
      var allItems = [];
      FEATURES.forEach(function(g) { allItems = allItems.concat(g.items); });
      this.checking = true;
      this.progress = 0;
      this.addLog('=== 开始全面状态检测 ===');
      var chain = Promise.resolve();
      allItems.forEach(function(item, i) {
        chain = chain.then(function() {
          return self.checkItem(item).then(function() {
            self.progress = Math.round(((i + 1) / allItems.length) * 100);
          });
        });
      });
      return chain.then(function() {
        return sh('getenforce 2>/dev/null || echo "Unknown"').then(function(r) {
          self.selinuxStatus = r.stdout.trim();
        });
      }).then(function() {
        self.addLog('=== 状态检测完成 ===');
        self.checking = false;
      });
    },
    // ---------- Debug ----------
    showDebug: function() {
      var self = this;
      this.debugOpen = true;
      this.debugHtml = '<div style="text-align:center;padding:20px;color:var(--mdui-color-on-surface-variant)">正在收集 Debug 数据...</div>';
      var chain = Promise.resolve();
      var html = '';
      FEATURES.forEach(function(g) {
        g.items.forEach(function(item) {
          chain = chain.then(function() {
            return self.readProp(item.key)
              .then(function() { return sh(item.checkCmd); })
              .then(function(r) { self.debugData[item.key].checkRaw = r.stdout.trim(); return sh(item.verifyCmd); })
              .then(function(r) { self.debugData[item.key].verifyRaw = r.stdout.trim(); });
          });
        });
      });
      chain.then(function() {
        // 读取 service.log 尾部（disable_pkg 失败原因的关键证据）
        return sh('tail -n 80 /data/adb/logd_disabler/service.log 2>/dev/null || echo "(无 service.log)"')
          .then(function(r) { self.serviceLogTail = r.stdout.trim(); });
      }).then(function() {
        var s = self.state;
        html += '<div style="margin-bottom:12px;font-weight:600">⚠️ Warn/Error 日志 (' + self.warnLogs.length + ')</div>';
        if (self.warnLogs.length === 0) {
          html += '<div class="debug-item"><div class="v" style="color:var(--mdui-color-primary)">✅ 无警告或错误</div></div>';
        } else {
          self.warnLogs.forEach(function(l) {
            html += '<div class="debug-item"><div class="v">' + escapeHtml(l) + '</div></div>';
          });
        }
        html += '<div style="margin:16px 0 12px;font-weight:600">📜 service.log 尾部 (最后 80 行)</div>';
        html += '<div class="debug-item"><div class="raw">' + escapeHtml(self.serviceLogTail || '(无)') + '</div></div>';
        html += '<div style="margin:16px 0 12px;font-weight:600">📊 状态检测原始数据</div>';
        FEATURES.forEach(function(g) {
          g.items.forEach(function(item) {
            var d = self.debugData[item.key];
            var st = s[item.key];
            var statusText = st.enabled ? '✅ 已启用' : '⭕ 未启用';
            if (st.status === 'error') statusText = '❌ 异常';
            html += '<div class="debug-item">';
            html += '<div class="k">' + item.title + ' (' + item.key + ')</div>';
            html += '<div class="v">UI状态: ' + statusText + '</div>';
            html += '<div class="raw">📌 属性值 (' + PROP_PREFIX + item.key + '):\n' + (d.prop || '(空)') + '</div>';
            html += '<div class="raw">🔍 checkCmd 输出:\n' + (d.checkRaw || '(空)') + '</div>';
            html += '<div class="raw">📋 verifyCmd 输出:\n' + (d.verifyRaw || '(空)') + '</div>';
            html += '</div>';
          });
        });
        self.debugHtml = html;
      });
    },
    copyDebugInfo: function() {
      var self = this;
      var text = '=== ColorOS16 Debug Info ===\n';
      text += 'Time: ' + new Date().toISOString() + '\n\n';
      text += '--- Warn/Error Logs ---\n';
      text += (self.warnLogs.length ? self.warnLogs.join('\n') : '(none)') + '\n\n';
      text += '--- service.log Tail (last 80 lines) ---\n';
      text += (self.serviceLogTail || '(无)') + '\n\n';
      text += '--- Feature States ---\n';
      FEATURES.forEach(function(g) {
        text += '\n[' + g.group + ']\n';
        g.items.forEach(function(item) {
          var d = self.debugData[item.key];
          var s = self.state[item.key];
          text += item.title + ' (' + item.key + '): ' + (s.enabled ? 'enabled' : 'disabled') + '\n';
          text += '  Prop: ' + (d.prop || 'N/A') + '\n';
          text += '  check: ' + (d.checkRaw || 'N/A') + '\n';
          text += '  verify: ' + (d.verifyRaw || 'N/A') + '\n';
        });
      });
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { alert('✅ Debug 信息已复制到剪贴板！'); });
      } else {
        var safeText = text.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\$/g, '\\$').replace(/`/g, '\\`');
        sh('echo "' + safeText + '" > /data/adb/logd_disabler/debug_info.txt').then(function() {
          alert('✅ Debug 信息已保存到:\n/data/adb/logd_disabler/debug_info.txt');
        });
      }
    }
  },
  mounted: function() {
    var self = this;
    this.addLog('WebUI 初始化完成');
    // 读取模块版本（module.prop）
    sh('cat /data/adb/modules/Logd_Disabler_ColorOS16/module.prop 2>/dev/null | grep "^version=" | head -1').then(function(r) {
      var m = r.stdout.match(/version=(.+)/);
      if (m) self.moduleVersion = m[1].trim();
    });
    // 读取 KernelSU 版本
    sh('cat /data/adb/ksu/version 2>/dev/null || cat /data/adb/ksu/ksud_version 2>/dev/null || echo "KernelSU"').then(function(r) {
      var v = r.stdout.trim();
      self.ksuVersion = v || 'KernelSU';
    });
    this.refreshAll();
  }
});

// 关键：告诉 Vue 把 mdui-* 当作自定义元素处理，避免组件解析警告
app.config.compilerOptions.isCustomElement = function(tag) {
  return tag.startsWith('mdui-');
};
app.mount('#app');
</script>
